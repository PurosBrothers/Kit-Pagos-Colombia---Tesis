# CI Pipeline
name: CI Pipeline

on: 
  pull_request:
    branches: [devops,main]
  push:
    branches: [devops,main]

jobs:
  sdk:
    name: SDK (Lint, Tests and Coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm' 
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test with coverage
        run: npm test -- --coverage

      - name: Build SDK
        run: npm run build

      - name: Verify package tarball
        run: npm pack --dry-run

  examples:
    name: Examples (Compile against SDK build)
    runs-on: ubuntu-latest
    needs: sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: ./sdk
        run: npm ci

      - name: Build SDK
        working-directory: ./sdk
        run: npm run build

      - name: Install examples against the built SDK
        working-directory: ./examples
        run: npm ci

      - name: Typecheck examples against the SDK build
        working-directory: ./examples
        run: npm run typecheck

  simulator-api:
    name: Simulator API (Lint, Tests and Coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./simulator-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm' 
          cache-dependency-path: simulator-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test with coverage
        run: npm test -- --coverage
    
      
      
    