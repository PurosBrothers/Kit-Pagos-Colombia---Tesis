# CI Pipeline
name: CI Pipeline

on: 
  pull_request:
    branches: [devops,main]
  push:
    branches: [devops,main]

jobs:
  sdk:
    name: SDK (Lint, Tests and Coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm' 
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test with coverage
        run: npm test -- --coverage

      - name: Verify CK metrics (DoD condition 4)
        run: npm run metrics

      - name: Build SDK
        run: npm run build

      - name: Verify package tarball
        run: npm pack --dry-run

  examples:
    name: Examples (Compile against SDK build)
    runs-on: ubuntu-latest
    needs: sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: ./sdk
        run: npm ci

      - name: Build SDK
        working-directory: ./sdk
        run: npm run build

      - name: Install examples against the built SDK
        working-directory: ./examples
        run: npm ci

      - name: Typecheck examples against the SDK build
        working-directory: ./examples
        run: npm run typecheck

  simulator-api:
    name: Simulator API (Lint, Tests and Coverage)
    runs-on: ubuntu-latest
    needs: sdk
    defaults:
      run:
        working-directory: ./simulator-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm' 
          cache-dependency-path: |
            simulator-api/package-lock.json
            sdk/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test with coverage
        run: npm test -- --coverage

      - name: Install SDK dependencies (the CK metrics script lives in sdk/scripts)
        working-directory: ./sdk
        run: npm ci

      - name: Verify CK metrics with the simulator's exceptions (DoD condition 4, issue #153)
        working-directory: ./sdk
        run: >-
          npm run metrics --
          --root ../simulator-api/src
          --tsconfig ../simulator-api/tsconfig.json
          --exceptions ../simulator-api/ck-exceptions.json
          --mode guard

  landing:
    name: Landing (Snippet Guard & Build)
    runs-on: ubuntu-latest
    needs: sdk
    defaults:
      run:
        working-directory: ./landing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: Install SDK dependencies
        working-directory: ./sdk
        run: npm ci

      - name: Build SDK
        working-directory: ./sdk
        run: npm run build

      - name: Install landing dependencies
        run: npm ci

      - name: Verify snippet compilation guard
        run: npm run check:snippets

      - name: Build landing static site
        run: npm run build

  prototypes:
    name: Prototypes (${{ matrix.prototype }}, Typecheck, Tests and Coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prototype: [checkout-sin-solucion, checkout-con-sdk-front-back]
    defaults:
      run:
        working-directory: ./prototypes/${{ matrix.prototype }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prototypes/${{ matrix.prototype }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run test with coverage
        run: npm test -- --coverage

  prototype-frontend-rest:
    name: Prototype C (checkout-frontend-rest, Typecheck, Tests, Coverage and Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./prototypes/checkout-frontend-rest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prototypes/checkout-frontend-rest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run test with coverage
        run: npm test -- --coverage

      - name: Build static client
        run: npm run build

  prototypes-parity:
    name: Prototypes (Skeleton parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that only the payments module differs and that A does not use the SDK
        run: ./prototypes/check-skeleton-parity.sh
