name: Publish SDK to npm

on:
  push:
    branches:
      - main
    paths:
      - 'sdk/**'
  workflow_dispatch: # Permite también dispararlo manualmente si se desea

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check if version is already published
        id: check_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          if npm view kit-pagos-colombia@$CURRENT_VERSION version > /dev/null 2>&1; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "La versión $CURRENT_VERSION ya está publicada en npm. Omitiendo publicación."
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Nueva versión $CURRENT_VERSION detectada. Se procederá a publicar."
          fi

      - name: Run tests
        if: steps.check_version.outputs.already_published == 'false'
        run: npm test

      - name: Build SDK
        if: steps.check_version.outputs.already_published == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.check_version.outputs.already_published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
